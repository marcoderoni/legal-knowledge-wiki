<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace">
  <defs>
    <style>
      .term-bg { fill: #080c14; }
      .term-bar { fill: #0e1421; }
      .term-dot-r { fill: #ff6b6b; }
      .term-dot-y { fill: #e8c547; }
      .term-dot-g { fill: #7affa0; }
      .t { font-size: 12px; }
      .yellow { fill: #e8c547; }
      .cyan   { fill: #7ecfff; }
      .green  { fill: #7affa0; }
      .orange { fill: #ff9f6b; }
      .red    { fill: #ff6b6b; }
      .dim    { fill: #5a7a9a; }
      .white  { fill: #c8d8f0; }
      .magenta{ fill: #d49bff; }

      .l01 { animation: fade 14s infinite; animation-delay: 0s; opacity: 0; }
      .l02 { animation: fade 14s infinite; animation-delay: 0.6s; opacity: 0; }
      .l03 { animation: fade 14s infinite; animation-delay: 1.2s; opacity: 0; }
      .l04 { animation: fade 14s infinite; animation-delay: 2.0s; opacity: 0; }
      .l05 { animation: fade 14s infinite; animation-delay: 2.8s; opacity: 0; }
      .l06 { animation: fade 14s infinite; animation-delay: 3.6s; opacity: 0; }
      .l07 { animation: fade 14s infinite; animation-delay: 4.4s; opacity: 0; }
      .l08 { animation: fade 14s infinite; animation-delay: 5.2s; opacity: 0; }
      .l09 { animation: fade 14s infinite; animation-delay: 6.0s; opacity: 0; }
      .l10 { animation: fade 14s infinite; animation-delay: 6.8s; opacity: 0; }
      .l11 { animation: fade 14s infinite; animation-delay: 7.6s; opacity: 0; }
      .l12 { animation: fade 14s infinite; animation-delay: 8.4s; opacity: 0; }
      .l13 { animation: fade 14s infinite; animation-delay: 9.2s; opacity: 0; }
      .l14 { animation: fade 14s infinite; animation-delay: 10.0s; opacity: 0; }
      .l15 { animation: fade 14s infinite; animation-delay: 10.8s; opacity: 0; }
      .l16 { animation: fade 14s infinite; animation-delay: 11.6s; opacity: 0; }

      @keyframes fade {
        0%   { opacity: 0; }
        5%   { opacity: 1; }
        90%  { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect width="720" height="420" rx="10" class="term-bg"/>
  <rect width="720" height="32" rx="10" class="term-bar"/>
  <rect y="22" width="720" height="10" class="term-bar"/>
  <circle cx="20" cy="16" r="6" class="term-dot-r"/>
  <circle cx="40" cy="16" r="6" class="term-dot-y"/>
  <circle cx="60" cy="16" r="6" class="term-dot-g"/>
  <text x="320" y="21" text-anchor="middle" font-size="11" fill="#5a7a9a">legal-knowledge-wiki — python main.py --no-wiki</text>

  <!-- Line 1 -->
  <g class="l01">
    <text x="20" y="62" class="t yellow">⚖  Legal Knowledge Wiki  v2</text>
  </g>
  <g class="l02">
    <text x="20" y="80" class="t cyan">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
  </g>
  <g class="l03">
    <text x="20" y="104" class="t magenta">  ── Phase 1 — Extract ──</text>
  </g>
  <g class="l04">
    <text x="20" y="122" class="t cyan">  ➤  Found 5 document(s) to process</text>
  </g>
  <g class="l05">
    <text x="20" y="140" class="t cyan">  ➤  [1/5] Extracting: MOA_Playbook.docx  → 16 chunks</text>
  </g>
  <g class="l06">
    <text x="20" y="158" class="t green">  ✓  143 concepts | 118 connections</text>
  </g>
  <g class="l07">
    <text x="20" y="182" class="t magenta">  ── Phase 2 — Connect + Gap analysis ──</text>
  </g>
  <g class="l08">
    <text x="20" y="200" class="t cyan">  ➤  Building cross-document connections...</text>
    <text x="20" y="216" class="t green">  ✓  Total connections: 247</text>
  </g>
  <g class="l09">
    <text x="20" y="234" class="t cyan">  ➤  Running gap analysis...</text>
    <text x="20" y="250" class="t green">  ✓  8 gap(s) | 12 research question(s)</text>
  </g>
  <g class="l10">
    <text x="20" y="274" class="t magenta">  ── Phase 5 — Graph, prompts, todos, ontology ──</text>
  </g>
  <g class="l11">
    <text x="20" y="292" class="t cyan">  ➤  Building HTML knowledge graph (150 nodes)...</text>
    <text x="20" y="308" class="t green">  ✓  Graph → output/knowledge_graph.html</text>
  </g>
  <g class="l12">
    <text x="20" y="326" class="t cyan">  ➤  Exporting gap-bridge prompts...</text>
    <text x="20" y="342" class="t green">  ✓  Prompts → output/graph_prompts.md</text>
  </g>
  <g class="l13">
    <text x="20" y="360" class="t cyan">  ➤  Updating .infranodus/ ontology...</text>
    <text x="20" y="376" class="t green">  ✓  Ontology run #1 — 150 concepts, 247 connections</text>
  </g>
  <g class="l14">
    <text x="20" y="394" class="t green">  ✓  CLAUDE.md + agents.md written to project root</text>
  </g>
  <g class="l15">
    <text x="20" y="412" class="t dim">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
  </g>
  <g class="l16">
    <text x="20" y="412" class="t green">  Done. ⚖  Graph → output/knowledge_graph.html</text>
  </g>
</svg>
